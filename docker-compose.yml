# Local backing services for development.
#
# The app and Inngest run on the host with `npm run dev`; only Redis and its
# Upstash-compatible REST proxy run in Docker. `npm run dev:local` starts
# these services, the Supabase CLI stack, and the host dev servers together.
#
# - redis: local Redis (127.0.0.1:6379)
# - redis-http: Upstash-compatible REST proxy (http://127.0.0.1:8079)
#
# The Supabase CLI manages its own containers (`npx supabase start`); it is not
# part of this Compose project. See docs/setup/local.md.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
      SRH_MAX_CONNECTIONS: 10

volumes:
  redis-data:
