name: Bug report
description: Report a reproducible bug
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Route, business setup, minimal steps
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, browser, commit SHA
