name: model-drift

# Live AI model catalog drift check. Runs the strict listing comparison with
# real provider secrets — a green run means the catalog was really compared.
# PR CI intentionally skips this (see CATALOG_DRIFT_ALLOW_MISSING in ci.yml)
# because PR runners have no provider keys and must stay deterministic.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: catalog drift (live provider listing)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/requo
      BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-so-zod-passes
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Strict mode: no CATALOG_DRIFT_ALLOW_MISSING, so missing credentials
      # or retired identifiers fail loudly.
      - run: npm run check:models
