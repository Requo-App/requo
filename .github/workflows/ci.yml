name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (lint + typecheck + audits + catalog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/requo
      BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-so-zod-passes
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
      # PR CI has no live provider keys: skip live model-listing comparison.
      # The scheduled model-drift workflow runs the strict comparison nightly.
      CATALOG_DRIFT_ALLOW_MISSING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: test (unit + components)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Unit/component tiers seed their own deterministic env via
      # tests/setup.ts -> applyTestEnv(); no secrets or DB needed.
      - run: npm run test

  integration:
    name: integration (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: requo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d requo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/requo
      BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-so-zod-passes
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000/api/auth
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The migrations reference Supabase roles and storage.buckets.
      - run: node scripts/test/bootstrap-ci-db.mjs
      - run: npm run test:integration

  e2e:
    name: e2e (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: requo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d requo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/requo
      BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-so-zod-passes
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000/api/auth
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
      # Playwright owns the dev server lifecycle and migrates/seeds its own
      # database. The interactive health check probes hosted Supabase, which
      # this job intentionally does not provide.
      SKIP_HEALTH_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/test/bootstrap-ci-db.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/
            reports/playwright.json
          retention-days: 7

  build:
    name: build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/requo
      BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-so-zod-passes
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
